<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Cihaz Detay</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
    <h2>IoT Cihaz Yonetim Sistemi</h2>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="locations.html">Lokasyonlar</a>
        <a href="devices.html">Cihazlar</a>
    </div>
    <button id="logoutButton">Cikis Yap</button>
</nav>

    <main>
        <h1 id="deviceTitle">Cihaz Detayı</h1>
        <div id="deviceInfo" class="device-form"></div>

        <h2>Komut Gönder</h2>
        <div class="command-buttons">
            <button onclick="handleSendCommand('START')">START</button>
            <button onclick="handleSendCommand('STOP')">STOP</button>
            <button onclick="handleSendCommand('RESET')">RESET</button>
        </div>
        <p id="commandMessage"></p>

        <h2>Komut Geçmişi</h2>
        <table>
            <thead>
                <tr><th>Tip</th><th>Durum</th><th>Oluşturulma</th></tr>
            </thead>
            <tbody id="commandsTableBody"></tbody>
        </table>

        <h2>Sıcaklık Grafiği (Son 24 Saat)</h2>
        <canvas id="temperatureChart"></canvas>
    </main>

    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/device-detail.js"></script>
</body>
</html>

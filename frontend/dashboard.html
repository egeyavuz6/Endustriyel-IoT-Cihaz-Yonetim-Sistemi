<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>IoT Yönetim Sistemi - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <h2>IoT Cihaz Yönetim Sistemi</h2>
        <button id="logoutButton">Çıkış Yap</button>
    </nav>

    <main>
        <h1>Hoş Geldin!</h1>
        <div class="menu-cards">
            <a href="devices.html" class="card">
                <h3>Cihazlar</h3>
                <p>Tüm cihazları görüntüle ve yönet</p>
            </a>
        </div>
    </main>

    <script src="/frontend/assets/auth.js"></script>
    <script>
        // Sayfa yüklendiğinde token kontrolü
        if (!localStorage.getItem("access_token")) {
            window.location.href = "index.html";
        }

        document.getElementById("logoutButton").addEventListener("click", function () {
            localStorage.removeItem("access_token");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>

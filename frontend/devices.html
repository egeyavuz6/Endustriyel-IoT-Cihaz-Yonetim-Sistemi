<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Cihazlar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
    <h2>IoT Cihaz Yonetim Sistemi</h2>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="locations.html">Lokasyonlar</a>
        <a href="devices.html">Cihazlar</a>
    </div>
    <button id="logoutButton">Cikis Yap</button>
</nav>

    <main>
    <h1>Cihaz Listesi</h1>

    <form id="createDeviceForm" class="device-form">
        <h3>Yeni Cihaz Ekle</h3>
        <input type="text" id="deviceName" placeholder="Cihaz Adı" required>
        <input type="text" id="serialNumber" placeholder="Seri Numarası" required>
        <select id="deviceType" required>
            <option value="SENSOR">Sensor</option>
            <option value="ENGINE">Engine</option>
            <option value="AC">AC</option>
        </select>
        <input type="text" id="location" placeholder="Lokasyon" required>
        <button type="submit">Cihaz Ekle</button>
    </form>
    <p id="formMessage"></p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>İsim</th>
                <th>Seri No</th>
                <th>Tip</th>
                <th>Lokasyon</th>
                <th>Durum</th>
                <th>İşlem</th>
            </tr>
        </thead>
        <tbody id="devicesTableBody">
        </tbody>
    </table>
</main>

    <script src="js/api.js"></script>
    <script src="js/devices.js"></script>
</body>
</html>

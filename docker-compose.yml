services:
  simulator1:
    image: pai-simulator:latest
    container_name: pai-simulator1
    ports:
      - "8090:8080"      # HTTP / Swagger UI
      - "1502:1502"      # Modbus TCP
      - "1161:1161/udp"  # SNMP UDP
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/device_management
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      MQTT_HOSTNAME: localhost:1883
      MQTT_USERNAME: admin
      MQTT_PASSWORD: admin
      MQTT_SSL: false
      MQTT_TOPIC: osos
      SNMP_PORT: 1161
      MODBUS_PORT: 1502

  simulator2:
    image: pai-simulator:latest
    container_name: pai-simulator2
    ports:
      - "8091:8080"      # HTTP / Swagger UI
      - "1503:1502"      # Modbus TCP
      - "1162:1161/udp"  # SNMP UDP
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/device_management
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      MQTT_HOSTNAME: localhost:1883
      MQTT_USERNAME: admin
      MQTT_PASSWORD: admin
      MQTT_SSL: false
      MQTT_TOPIC: osos
      SNMP_PORT: 1161
      MODBUS_PORT: 1502

  simulator3:
    image: pai-simulator:latest
    container_name: pai-simulator3
    ports:
      - "8092:8080"      # HTTP / Swagger UI
      - "1504:1502"      # Modbus TCP
      - "1163:1161/udp"  # SNMP UDP
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/device_management
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      MQTT_HOSTNAME: localhost:1883
      MQTT_USERNAME: admin
      MQTT_PASSWORD: admin
      MQTT_SSL: false
      MQTT_TOPIC: osos
      SNMP_PORT: 1161
      MODBUS_PORT: 1502


  postgres:
    image: postgres:15
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: device_management
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123456
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: device_telemetry
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "gpcprz6dHBdiol0obaU85nXOyfdOxd4M"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "http://localhost:8180/realms/iot-device-management/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak:8080/realms/iot-device-management/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak:8080/realms/iot-device-management/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles, 'ROLE_ADMIN') && 'Admin' || contains(realm_access.roles, 'ROLE_OPERATOR') && 'Editor' || 'Viewer'"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "sandbox.smtp.mailtrap.io:2525"
      GF_SMTP_USER: "6e38f4d37c8bff"
      GF_SMTP_PASSWORD: "fddbc1378cd8c2"
      GF_SMTP_FROM_ADDRESS: "alerts@iot-system.com"
      GF_SMTP_SKIP_VERIFY: "true"
    volumes:
      - grafana_data:/var/lib/grafana

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    command: start-dev
    ports: ["8180:8080"]  
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  postgres_data:
  influxdb_data:
  grafana_data:
  keycloak_data:

